name: Sync Repo ZIP to Drive

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repo URL or owner/repo to clone (empty = this repo)"
        required: false
        default: ""
      branch:
        description: "Optional branch or tag (empty = default branch)"
        required: false
        default: ""
      max_zip_mb:
        description: "Max size per ZIP part in MB (default 9, strictly <10MB)"
        required: false
        default: "9"
      mode:
        description: "rclone mode: sync (mirror & delete removed) or copy (add/update only)"
        required: false
        type: choice
        default: sync
        options:
          - sync
          - copy
  push:
    branches: [ main ]
    paths-ignore:
      - ".github/**"
      - "jobs.json"

permissions:
  contents: read
  actions: write

jobs:
  sync-to-drive:
    name: Pack (<10MB ZIPs) & Sync to Google Drive (rclone)
    runs-on: ubuntu-latest
    steps:
      - name: Prepare source repository
        id: prep
        env:
          INPUT_REPO_URL: ${{ inputs.repo_url }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          rm -rf /tmp/src-repo
          if [ -n "${INPUT_REPO_URL}" ]; then
            URL="${INPUT_REPO_URL}"
            if [[ "${URL}" != http://* && "${URL}" != https://* && "${URL}" != git@* ]]; then
              URL="https://github.com/${URL}"
            fi
            REPO_NAME="$(basename "${URL%/}")"
            REPO_NAME="${REPO_NAME%.git}"
            echo "Cloning ${URL} into /tmp/src-repo (target Drive folder: ${REPO_NAME})"
            if [ -n "${INPUT_BRANCH}" ]; then
              git clone --depth 1 --branch "${INPUT_BRANCH}" "${URL}" /tmp/src-repo
            else
              git clone --depth 1 "${URL}" /tmp/src-repo
            fi
          else
            REPO_NAME="${GITHUB_REPOSITORY##*/}"
            git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/src-repo
          fi
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Pack repository into standalone <10MB ZIP parts
        env:
          REPO_NAME: ${{ steps.prep.outputs.repo_name }}
          MAX_ZIP_MB: ${{ inputs.max_zip_mb || '9' }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os, pathlib, shutil, zipfile, zlib

          src = pathlib.Path("/tmp/src-repo")
          out_dir = pathlib.Path("/tmp/out-zips")
          if out_dir.exists():
              shutil.rmtree(out_dir)
          out_dir.mkdir(parents=True)

          repo_name = os.environ["REPO_NAME"]
          max_mb = float(os.environ.get("MAX_ZIP_MB", "9"))
          # Keep safety margin for ZIP central directory overhead so every file is strictly < max_mb MB (and <10MB)
          limit_bytes = int(min(max_mb, 9.5) * 1024 * 1024)
          central_dir_margin = 256 * 1024
          target_bytes = max(limit_bytes - central_dir_margin, 1024 * 1024)

          files = []
          for p in sorted(src.rglob("*")):
              if not p.is_file() or p.is_symlink():
                  continue
              rel = p.relative_to(src)
              if rel.parts[0] in {".git", ".github"}:
                  continue
              files.append((p, rel.as_posix()))

          part_idx = 1
          zf = None
          cur_path = None
          cur_est = 0
          cur_count = 0

          def open_next():
              global part_idx, zf, cur_path, cur_est, cur_count
              if zf is not None:
                  zf.close()
              cur_path = out_dir / f"{repo_name}_part{part_idx:03d}.zip"
              part_idx += 1
              zf = zipfile.ZipFile(cur_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6)
              cur_est = 0
              cur_count = 0

          def split_oversized_file(file_path: pathlib.Path, rel_posix: str):
              global part_idx
              tmp_zip = out_dir / f"_oversized_{part_idx:03d}.zip"
              with zipfile.ZipFile(tmp_zip, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as oz:
                  oz.write(file_path, rel_posix)
              if tmp_zip.stat().st_size <= limit_bytes:
                  final_p = out_dir / f"{repo_name}_part{part_idx:03d}.zip"
                  part_idx += 1
                  tmp_zip.rename(final_p)
                  return
              # Split compressed archive into <limit_bytes chunks
              chunk_idx = 1
              base = f"{repo_name}_part{part_idx:03d}.zip"
              part_idx += 1
              with tmp_zip.open("rb") as rf:
                  while True:
                      chunk = rf.read(limit_bytes)
                      if not chunk:
                          break
                      (out_dir / f"{base}.{chunk_idx:03d}").write_bytes(chunk)
                      chunk_idx += 1
              tmp_zip.unlink()

          open_next()
          for p, rel_posix in files:
              raw = p.read_bytes()
              comp_len = len(zlib.compress(raw, 6)) + len(rel_posix) + 128
              if comp_len > target_bytes:
                  split_oversized_file(p, rel_posix)
                  continue
              if cur_count > 0 and (cur_est + comp_len) > target_bytes:
                  open_next()
              zf.writestr(rel_posix, raw)
              cur_est += comp_len
              cur_count += 1

          if zf is not None:
              zf.close()
              if cur_count == 0 and cur_path and cur_path.exists():
                  cur_path.unlink()

          created = sorted(out_dir.iterdir())
          total = sum(f.stat().st_size for f in created)
          max_actual = max((f.stat().st_size for f in created), default=0)
          print(f"Packed {len(files)} files into {len(created)} part(s), total={total/1024/1024:.2f} MB, max_part={max_actual/1024/1024:.2f} MB")
          for f in created:
              print(f"  {f.name}: {f.stat().st_size/1024/1024:.2f} MB")
          PY

      - name: Install rclone
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi

      - name: Sync ZIP parts to Google Drive/<repo_name> via rclone
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_MODE: ${{ inputs.mode || 'sync' }}
          REPO_NAME: ${{ steps.prep.outputs.repo_name }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import datetime, json, os, pathlib, urllib.parse, urllib.request

          cid = os.environ["GDRIVE_CLIENT_ID"].strip()
          csec = os.environ["GDRIVE_CLIENT_SECRET"].strip()
          rtok = os.environ["GDRIVE_REFRESH_TOKEN"].strip()
          fid = os.environ["GDRIVE_FOLDER_ID"].strip()

          data = urllib.parse.urlencode({
              "client_id": cid,
              "client_secret": csec,
              "refresh_token": rtok,
              "grant_type": "refresh_token",
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              tok_resp = json.loads(resp.read().decode("utf-8"))

          expires_in = int(tok_resp.get("expires_in", 3600))
          expiry = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(seconds=expires_in - 60)).strftime("%Y-%m-%dT%H:%M:%SZ")
          token_json = json.dumps({
              "access_token": tok_resp["access_token"],
              "token_type": tok_resp.get("token_type", "Bearer"),
              "refresh_token": rtok,
              "expiry": expiry,
          })
          cfg = "\n".join([
              "[gdrive]",
              "type = drive",
              f"client_id = {cid}",
              f"client_secret = {csec}",
              "scope = drive",
              f"root_folder_id = {fid}",
              f"token = {token_json}",
              "",
          ])
          p = pathlib.Path("/tmp/rclone.conf")
          p.write_text(cfg, encoding="utf-8")
          p.chmod(0o600)
          PY

          echo "Syncing /tmp/out-zips -> gdrive:${REPO_NAME}"
          rclone "${RCLONE_MODE}" /tmp/out-zips "gdrive:${REPO_NAME}" \
            --config /tmp/rclone.conf \
            --transfers 8 \
            --checkers 16 \
            --fast-list \
            -v

      - name: Cleanup temp files
        if: always()
        run: rm -rf /tmp/rclone.conf /tmp/src-repo /tmp/out-zips

      - name: Auto-clean previous completed CI runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status == \"completed\") | .id")
          for id in $runs; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" || true
          done