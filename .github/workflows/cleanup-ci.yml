name: Cleanup CI Runs

on:
  workflow_run:
    workflows:
      - "Sync Repo ZIP to Drive"
      - "Download Video to Drive"
    types: [completed]

permissions:
  actions: write

jobs:
  delete-completed-runs:
    name: Delete completed workflow runs
    runs-on: ubuntu-latest
    steps:
      - name: Delete triggering run and any other completed runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${TRIGGER_RUN_ID}" || true
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status == \"completed\" and .name != \"Lua 5.1 Validation\") | .id")
          for id in $runs; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" || true
          done