name: Download Video to Drive

on:
  push:
    branches: [ main ]
    paths:
      - "jobs.json"
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL (leave empty to process jobs.json from your Drive folder)"
        required: false
        default: ""
      start_time:
        description: "Optional start timestamp (e.g. 00:00:15 or 15)"
        required: false
        default: ""
      end_time:
        description: "Optional end timestamp (e.g. 00:00:35 or 35)"
        required: false
        default: ""
      format:
        description: "Output format"
        required: false
        type: choice
        default: mp4
        options:
          - mp4
          - mp3
          - m4a
          - both
      max_height:
        description: "Max video resolution height (e.g. 720 or 1080)"
        required: false
        default: "720"
      output_name:
        description: "Optional output filename without extension"
        required: false
        default: ""
      subfolder:
        description: "Target subfolder inside Drive & GH_backup/ (default: clips)"
        required: false
        default: "clips"

permissions:
  contents: write
  actions: write

jobs:
  download-to-drive:
    name: Download, Trim, Validate & Sync Media (Cookie-Free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pytubefix, yt-dlp, YouTube.js, ffmpeg, and rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pip
          python3 -m pip install -q -U pytubefix "yt-dlp[default]"
          npm install --no-save --prefix /tmp/ytjs youtubei.js >/dev/null 2>&1 || true
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi
          python3 -c "import pytubefix; print('pytubefix:', pytubefix.__version__)"
          yt-dlp --version
          ffmpeg -version | head -n 1

      - name: Prepare rclone config
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import datetime, json, os, pathlib, urllib.parse, urllib.request

          cid = os.environ["GDRIVE_CLIENT_ID"].strip()
          csec = os.environ["GDRIVE_CLIENT_SECRET"].strip()
          rtok = os.environ["GDRIVE_REFRESH_TOKEN"].strip()
          fid = os.environ["GDRIVE_FOLDER_ID"].strip()

          data = urllib.parse.urlencode({
              "client_id": cid,
              "client_secret": csec,
              "refresh_token": rtok,
              "grant_type": "refresh_token",
          }).encode("utf-8")
          req = urllib.request.Request(
              "https://oauth2.googleapis.com/token",
              data=data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              tok_resp = json.loads(resp.read().decode("utf-8"))

          expires_in = int(tok_resp.get("expires_in", 3600))
          expiry = (datetime.datetime.now(datetime.timezone.utc) + datetime.timedelta(seconds=expires_in - 60)).strftime("%Y-%m-%dT%H:%M:%SZ")
          token_json = json.dumps({
              "access_token": tok_resp["access_token"],
              "token_type": tok_resp.get("token_type", "Bearer"),
              "refresh_token": rtok,
              "expiry": expiry,
          })
          cfg = "\n".join([
              "[gdrive]",
              "type = drive",
              f"client_id = {cid}",
              f"client_secret = {csec}",
              "scope = drive",
              f"root_folder_id = {fid}",
              f"token = {token_json}",
              "",
          ])
          p = pathlib.Path("/tmp/rclone.conf")
          p.write_text(cfg, encoding="utf-8")
          p.chmod(0o600)
          PY

      - name: Download (cookie-free multi-engine), trim, validate with ffprobe, and upload
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_URL: ${{ inputs.url }}
          INPUT_START: ${{ inputs.start_time }}
          INPUT_END: ${{ inputs.end_time }}
          INPUT_FORMAT: ${{ inputs.format || 'mp4' }}
          INPUT_MAX_HEIGHT: ${{ inputs.max_height || '720' }}
          INPUT_NAME: ${{ inputs.output_name }}
          INPUT_SUBFOLDER: ${{ inputs.subfolder || 'clips' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/media-raw /tmp/media-out
          python3 - << 'PY'
          import json, os, pathlib, re, shutil, subprocess, sys

          raw_dir = pathlib.Path("/tmp/media-raw")
          out_dir = pathlib.Path("/tmp/media-out")

          event_name = os.environ.get("EVENT_NAME", "")
          url = os.environ.get("INPUT_URL", "").strip()
          used_drive_jobs = False
          repo_jobs = pathlib.Path("jobs.json")

          if event_name == "push" and repo_jobs.exists():
              data = json.loads(repo_jobs.read_text(encoding="utf-8"))
              jobs = data if isinstance(data, list) else data.get("jobs", [])
          elif url:
              jobs = [{
                  "url": url,
                  "start": os.environ.get("INPUT_START", "").strip(),
                  "end": os.environ.get("INPUT_END", "").strip(),
                  "format": os.environ.get("INPUT_FORMAT", "mp4").strip(),
                  "max_height": os.environ.get("INPUT_MAX_HEIGHT", "720").strip(),
                  "name": os.environ.get("INPUT_NAME", "").strip(),
                  "subfolder": os.environ.get("INPUT_SUBFOLDER", "clips").strip() or "clips",
              }]
          else:
              jobs_path = pathlib.Path("/tmp/jobs.json")
              r = subprocess.run(
                  ["rclone", "copyto", "gdrive:jobs.json", str(jobs_path), "--config", "/tmp/rclone.conf"],
                  capture_output=True, text=True
              )
              if r.returncode != 0 or not jobs_path.exists():
                  raise SystemExit("No URL provided and no jobs.json found in Google Drive folder.")
              raw_json = jobs_path.read_text(encoding="utf-8")
              print("=== LOADED_JOBS_JSON ===")
              print(raw_json)
              print("=== END_JOBS_JSON ===")
              data = json.loads(raw_json)
              jobs = data if isinstance(data, list) else data.get("jobs", [])
              used_drive_jobs = True

          if not jobs:
              print("No jobs to process.")
              sys.exit(0)

          def try_pytubefix(j_url: str, fmt: str, max_h: int, dest_base: pathlib.Path) -> pathlib.Path | None:
              from pytubefix import YouTube
              for client in ("ANDROID_VR", "ANDROID", "IOS", "WEB"):
                  try:
                      yt = YouTube(j_url, client=client)
                      if fmt in ("mp3", "m4a"):
                          stream = yt.streams.filter(only_audio=True).order_by("abr").desc().first()
                          if not stream:
                              continue
                          dl = pathlib.Path(stream.download(output_path=str(dest_base.parent), filename=f"{dest_base.name}_raw_a.{stream.subtype}"))
                          print(f"  [pytubefix:{client}] downloaded audio -> {dl.name}")
                          return dl
                      else:
                          # Prefer progressive <= max_h, else adaptive video+audio merge
                          prog = yt.streams.filter(progressive=True, file_extension="mp4").order_by("resolution").desc()
                          chosen = None
                          for s in prog:
                              h = int((s.resolution or "0p").rstrip("p") or 0)
                              if h <= max_h:
                                  chosen = s
                                  break
                          v_stream = None
                          for s in yt.streams.filter(adaptive=True, only_video=True, file_extension="mp4").order_by("resolution").desc():
                              h = int((s.resolution or "0p").rstrip("p") or 0)
                              if h <= max_h:
                                  v_stream = s
                                  break
                          a_stream = yt.streams.filter(only_audio=True).order_by("abr").desc().first()
                          if v_stream and a_stream:
                              vp = pathlib.Path(v_stream.download(output_path=str(dest_base.parent), filename=f"{dest_base.name}_raw_v.mp4"))
                              ap = pathlib.Path(a_stream.download(output_path=str(dest_base.parent), filename=f"{dest_base.name}_raw_a.{a_stream.subtype}"))
                              merged = dest_base.parent / f"{dest_base.name}_raw_merged.mp4"
                              subprocess.run(["ffmpeg", "-y", "-loglevel", "error", "-i", str(vp), "-i", str(ap), "-c:v", "copy", "-c:a", "aac", "-shortest", str(merged)], check=True)
                              vp.unlink(missing_ok=True)
                              ap.unlink(missing_ok=True)
                              print(f"  [pytubefix:{client}] downloaded adaptive {v_stream.resolution}+audio -> {merged.name}")
                              return merged
                          elif chosen:
                              dl = pathlib.Path(chosen.download(output_path=str(dest_base.parent), filename=f"{dest_base.name}_raw.mp4"))
                              print(f"  [pytubefix:{client}] downloaded progressive {chosen.resolution} -> {dl.name}")
                              return dl
                  except Exception as e:
                      print(f"  [pytubefix:{client}] failed: {e}")
              return None

          def try_ytdlp(j_url: str, fmt: str, max_h: int, dest_base: pathlib.Path) -> pathlib.Path | None:
              for extra in (
                  ["--extractor-args", "youtube:player_client=android_vr"],
                  ["--extractor-args", "youtube:player_client=tv_embedded"],
                  [],
              ):
                  out_tpl = str(dest_base.parent / f"{dest_base.name}_ytdlp.%(ext)s")
                  cmd = ["yt-dlp", "--js-runtimes", "node", "--no-playlist", "--no-part", "-o", out_tpl] + extra
                  if fmt in ("mp3", "m4a"):
                      cmd += ["-f", "ba/best"]
                  else:
                      cmd += ["-f", f"bv*[height<={max_h}][ext=mp4]+ba[ext=m4a]/b[height<={max_h}]/best", "--merge-output-format", "mp4"]
                  cmd.append(j_url)
                  res = subprocess.run(cmd, capture_output=True, text=True)
                  if res.returncode == 0:
                      matches = list(dest_base.parent.glob(f"{dest_base.name}_ytdlp.*"))
                      if matches:
                          print(f"  [yt-dlp:{extra or 'default'}] downloaded -> {matches[0].name}")
                          return matches[0]
                  else:
                      err_line = (res.stderr or "").strip().splitlines()[-1:] or [""]
                      print(f"  [yt-dlp:{extra or 'default'}] failed: {err_line[0]}")
              return None

          def trim_and_encode(raw_path: pathlib.Path, final_path: pathlib.Path, fmt: str, start: str, end: str, max_h: int):
              cmd = ["ffmpeg", "-y", "-loglevel", "error"]
              if start:
                  cmd += ["-ss", start]
              cmd += ["-i", str(raw_path)]
              if end:
                  cmd += ["-to", end]
              if fmt == "mp3":
                  cmd += ["-vn", "-c:a", "libmp3lame", "-b:a", "192k", str(final_path)]
              elif fmt == "m4a":
                  cmd += ["-vn", "-c:a", "aac", "-b:a", "192k", str(final_path)]
              else:
                  cmd += [
                      "-vf", f"scale='min(iw,trunc(iw*{max_h}/ih/2)*2)':'min(ih,{max_h})':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2",
                      "-c:v", "libx264", "-preset", "fast", "-crf", "23",
                      "-c:a", "aac", "-b:a", "128k", "-movflags", "+faststart",
                      str(final_path),
                  ]
              subprocess.run(cmd, check=True)

          def ffprobe_validate(path: pathlib.Path, fmt: str) -> dict:
              r = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_format", "-show_streams", "-of", "json", str(path)],
                  capture_output=True, text=True, check=True
              )
              info = json.loads(r.stdout)
              dur = float(info.get("format", {}).get("duration", 0))
              streams = info.get("streams", [])
              v = next((s for s in streams if s.get("codec_type") == "video"), None)
              a = next((s for s in streams if s.get("codec_type") == "audio"), None)
              if dur <= 0:
                  raise RuntimeError("Invalid duration <= 0")
              if fmt == "mp4" and not v:
                  raise RuntimeError("Missing video stream")
              if not a:
                  raise RuntimeError("Missing audio stream")
              return {
                  "file": path.name,
                  "size_mb": round(path.stat().st_size / 1024 / 1024, 2),
                  "duration_s": round(dur, 2),
                  "video": f"{v.get('codec_name')} {v.get('width')}x{v.get('height')}" if v else None,
                  "audio": f"{a.get('codec_name')} {a.get('sample_rate')}Hz {a.get('channels')}ch" if a else None,
              }

          subfolders_used = set()
          succeeded = []
          failed = []

          for idx, job in enumerate(jobs, 1):
              j_url = job["url"].strip()
              sub = str(job.get("subfolder", "") or os.environ.get("INPUT_SUBFOLDER", "clips")).strip().strip("/") or "clips"
              start = str(job.get("start", "") or "").strip()
              end = str(job.get("end", "") or "").strip()
              max_h = int(str(job.get("max_height", "720") or "720").strip())
              name = str(job.get("name", "") or f"clip_{idx:02d}").strip()
              fmt = str(job.get("format", "mp4") or "mp4").strip().lower()
              fmts = ["mp4", "mp3"] if fmt == "both" else [fmt]

              subfolders_used.add(sub)
              tdir = out_dir / sub
              tdir.mkdir(parents=True, exist_ok=True)

              print(f"\n[{idx}/{len(jobs)}] {name} ({fmt}) start={start or '-'} end={end or '-'} url={j_url}")
              for f_item in fmts:
                  dest_base = raw_dir / f"{idx:02d}_{name}_{f_item}"
                  raw_file = try_pytubefix(j_url, f_item, max_h, dest_base)
                  if not raw_file:
                      raw_file = try_ytdlp(j_url, f_item, max_h, dest_base)
                  if not raw_file:
                      failed.append(f"{name}.{f_item}")
                      continue
                  final_file = tdir / f"{name}.{f_item}"
                  try:
                      trim_and_encode(raw_file, final_file, f_item, start, end, max_h)
                      meta = ffprobe_validate(final_file, f_item)
                      print(f"  [VALIDATED] {json.dumps(meta)}")
                      succeeded.append(meta)
                  except Exception as e:
                      print(f"  [ERROR] trim/validate failed for {name}.{f_item}: {e}")
                      failed.append(f"{name}.{f_item}")

          # Upload succeeded files to Drive AND copy into GH_backup/<sub/> for git commit
          if succeeded:
              for sub in sorted(subfolders_used):
                  sub_out = out_dir / sub
                  if any(sub_out.rglob("*")):
                      subprocess.run([
                          "rclone", "copy", str(sub_out), f"gdrive:{sub}",
                          "--config", "/tmp/rclone.conf", "--transfers", "4", "-v"
                      ], check=True)
                      gh_dest = pathlib.Path("GH_backup") / sub
                      gh_dest.mkdir(parents=True, exist_ok=True)
                      for f in sub_out.iterdir():
                          if f.is_file():
                              shutil.copy2(f, gh_dest / f.name)

          print(f"\nFINAL_SUMMARY: succeeded={len(succeeded)} failed={len(failed)}")
          if failed:
              print("FAILED_LIST:", ", ".join(failed))

          if used_drive_jobs and succeeded and not failed:
              subprocess.run([
                  "rclone", "moveto", "gdrive:jobs.json", "gdrive:jobs.done.json",
                  "--config", "/tmp/rclone.conf"
              ], check=False)

          if failed:
              sys.exit(1)
          PY

      - name: Commit and push validated clips to GitHub
        if: always()
        run: |
          if [ -d GH_backup ] && [ -n "$(git status --porcelain GH_backup)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add GH_backup
            git commit -m "media: add validated clips to GH_backup"
            git push
          fi

      - name: Cleanup temp files
        if: always()
        run: rm -rf /tmp/rclone.conf /tmp/media-raw /tmp/media-out /tmp/jobs.json

      - name: Auto-clean previous completed CI runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status == \"completed\") | .id")
          for id in $runs; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" || true
          done